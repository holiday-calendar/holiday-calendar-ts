name: Snapshot Publication

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [develop]

concurrency:
  group: snapshot-publish
  cancel-in-progress: false

jobs:
  publish-snapshot:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Verify checked-out commit matches triggering run
        run: |
          if [ "$(git rev-parse HEAD)" != "${{ github.event.workflow_run.head_sha }}" ]; then
            echo "Checked-out HEAD does not match workflow_run.head_sha" >&2
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
          scope: '@holiday-calendar'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Bump snapshot versions (core, then western)
        run: |
          TAG=next
          (cd packages/core && pnpm exec npm-snapshot "${{ github.event.workflow_run.run_number }}" "$TAG")
          (cd packages/western && pnpm exec npm-snapshot "${{ github.event.workflow_run.run_number }}" "$TAG")

      - name: Publish workspace (dependency order enforced by -r)
        run: pnpm publish -r --no-git-checks --tag next
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

name: Release Publication

on:
  push:
    branches: [main]

jobs:
  publish-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
          scope: '@holiday-calendar'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test with coverage
        run: pnpm run test:coverage

      - name: Require BOTH packages to be non-prerelease before publishing either
        run: |
          for pkg in core western; do
            VERSION=$(node -p "require('./packages/$pkg/package.json').version")
            echo "$pkg version: $VERSION"
            if [[ "$VERSION" == *-* ]]; then
              echo "::error::packages/$pkg is at prerelease version $VERSION — release publish requires both packages to be non-prerelease simultaneously."
              exit 1
            fi
          done

      - name: Publish workspace (dependency order enforced by -r)
        run: pnpm publish -r --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
